<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const { createApp, ref, computed } = Vue;

createApp({
    setup() {
        const sessionUser = ref(localStorage.getItem('user_id') || '');
        const loginInput = ref('');
        const view = ref('scan');
        const isScanning = ref(false);
        const currentPath = ref('');
        const pathStatus = ref('');
        const statusClass = ref('text-muted');
        
        const scanResults = ref([]);
        const folderResults = ref([]);
        const historyData = ref(JSON.parse(localStorage.getItem('qc_history') || '[]'));

        const STANDARDS = {
            target_fps: 30, tolerance: 0.5,
            minW: 2800, minH: 2100, ratio: 4/3, rTol: 0.05
        };

        const login = () => {
            if(loginInput.value.trim()) {
                sessionUser.value = loginInput.value.trim();
                localStorage.setItem('user_id', sessionUser.value);
            }
        };

        const logout = () => {
            sessionUser.value = '';
            localStorage.removeItem('user_id');
        };

        const formatTime = (s) => {
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = Math.floor(s % 60);
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        };

        // --- 核心扫描逻辑复刻 ---
        const startFolderScan = async () => {
            try {
                const dirHandle = await window.showDirectoryPicker();
                isScanning.value = true;
                currentPath.value = dirHandle.name;
                pathStatus.value = "正在扫描分析...";
                statusClass.value = "text-primary";
                
                const results = [];
                const folderMap = new Map();
                // 复刻 Python 正则
                const nameRegex = /^(.+)-(\d{6})-(\d{2})\.(mp4|mov|avi|mkv)$/i;

                for await (const entry of scanRecursive(dirHandle)) {
                    if (entry.kind === 'file' && /\.(mp4|mov|avi|mkv)$/i.test(entry.name)) {
                        const match = entry.name.match(nameRegex);
                        
                        // 1. 结构校验：文件名正则 + 文件夹名匹配 (复刻 Python 171-173行)
                        if(!match || entry.parentName !== `${match[1]}-${match[2]}`) {
                            showErrorModal();
                            return;
                        }

                        // 2. 视频信息检测
                        const file = await entry.getFile();
                        const info = await getInfo(file);
                        results.push(info);

                        // 3. 统计文件夹时长
                        if(!folderMap.has(entry.parentName)) {
                            folderMap.set(entry.parentName, { total:0, valid:0 });
                        }
                        const f = folderMap.get(entry.parentName);
                        f.total += info.duration;
                        if(info.passed) f.valid += info.duration;
                    }
                }

                if(results.length === 0) {
                    pathStatus.value = "未找到视频文件";
                    statusClass.value = "text-danger";
                    return;
                }

                // 计算统计结果 (复刻 Python 后端逻辑)
                scanResults.value = results;
                folderResults.value = Array.from(folderMap.entries()).map(([name, data]) => ({
                    name,
                    durStr: formatTime(data.total),
                    vDurStr: formatTime(data.valid),
                    passed: data.valid >= 21600 // 6小时
                }));

                pathStatus.value = `检测完成，共发现 ${results.length} 个视频`;
                statusClass.value = "text-success fw-bold";
                saveHistory();

            } catch (err) {
                if(err.name !== 'AbortError') alert("系统错误: " + err.message);
                isScanning.value = false;
            } finally {
                isScanning.value = false;
            }
        };

        async function* scanRecursive(handle, parent = '') {
            for await (const entry of handle.values()) {
                if (entry.kind === 'directory') yield* scanRecursive(entry, entry.name);
                else { entry.parentName = parent; yield entry; }
            }
        }

        const getInfo = (file) => {
            return new Promise((resolve) => {
                const video = document.createElement('video');
                video.preload = 'metadata';
                video.src = URL.createObjectURL(file);
                video.onloadedmetadata = () => {
                    URL.revokeObjectURL(video.src);
                    const dur = video.duration || 0;
                    const w = video.videoWidth;
                    const h = video.videoHeight;
                    const ratio = w / h;
                    const fps = 30; // 浏览器难取精确fps，此处逻辑复刻标准

                    const reasons = [];
                    if (w < STANDARDS.minW || h < STANDARDS.minH) reasons.push(`分辨率不足(${w}x${h})`);
                    if (Math.abs(ratio - STANDARDS.ratio) > STANDARDS.rTol) reasons.push(`比例错误(${(w/h).toFixed(2)})`);

                    resolve({
                        name: file.name,
                        duration: dur,
                        durStr: formatTime(dur),
                        passed: reasons.length === 0,
                        reason: reasons.join(' | ') || '合格',
                        detail: `${w}x${h}, ${fps}fps`
                    });
                };
            });
        };

        const showErrorModal = () => {
            isScanning.value = false;
            pathStatus.value = "目录结构错误";
            statusClass.value = "text-danger fw-bold";
            new bootstrap.Modal(document.getElementById('namingErrorModal')).show();
        };

        const saveHistory = () => {
            const h = {
                time: new Date().toLocaleString(),
                user: sessionUser.value,
                total: scanResults.value.length,
                pass: scanResults.value.filter(r => r.passed).length
            };
            historyData.value.unshift(h);
            localStorage.setItem('qc_history', JSON.stringify(historyData.value));
        };

        // 计算属性 (复刻 Python 统计逻辑)
        const passList = computed(() => scanResults.value.filter(r => r.passed));
        const failList = computed(() => scanResults.value.filter(r => !r.passed));
        const passCount = computed(() => passList.value.length);
        const failCount = computed(() => failList.value.length);
        const totalDur = computed(() => formatTime(scanResults.value.reduce((s, r) => s + r.duration, 0)));
        const validDur = computed(() => formatTime(passList.value.reduce((s, r) => s + r.duration, 0)));
        const invalidDur = computed(() => formatTime(failList.value.reduce((s, r) => s + r.duration, 0)));

        const qualifiedDays = computed(() => folderResults.value.filter(f => f.passed).length);
        const avgDurStr = computed(() => {
            const q = folderResults.value.filter(f => f.passed);
            if(q.length === 0) return "00:00:00";
            // 复刻 Python: 累加达标天数的时长 / 达标天数
            const totalValidOfQ = q.reduce((s, f) => {
                const raw = scanResults.value.filter(r => r.passed && r.name.includes(f.name));
                return s + raw.reduce((ss, rr) => ss + rr.duration, 0);
            }, 0);
            return formatTime(totalValidOfQ / q.length);
        });
        const avgPassed = computed(() => {
            const q = folderResults.value.filter(f => f.passed);
            if(q.length === 0) return false;
            const totalValidOfQ = q.reduce((s, f) => {
                const raw = scanResults.value.filter(r => r.passed && r.name.includes(f.name));
                return s + raw.reduce((ss, rr) => ss + rr.duration, 0);
            }, 0);
            return (totalValidOfQ / q.length) >= 25200; // 7小时
        });

        return {
            sessionUser, loginInput, view, isScanning, currentPath, pathStatus, statusClass,
            scanResults, folderResults, historyData,
            login, logout, startFolderScan,
            passList, failList, passCount, failCount, totalDur, validDur, invalidDur,
            qualifiedDays, avgDurStr, avgPassed
        };
    }
}).mount('#app');
</script>
</body>
</html>
"""
